<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" width="720" height="540" role="img" aria-labelledby="anaTitle anaDesc">
  <title id="anaTitle">Analyse des charges de copropriété</title>
  <desc id="anaDesc">Illustration abstraite représentant l'analyse de documents comptables et la répartition des postes de charges d'une copropriété.</desc>

  <defs>
    <linearGradient id="pg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F2EEE7"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#17614F"/>
      <stop offset="100%" stop-color="#2E8A71"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#071320" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="720" height="540" fill="#F4F0E9"/>

  <!-- Feuille arrière -->
  <g filter="url(#soft)">
    <rect x="118" y="66" width="360" height="450" rx="14" fill="#FFFFFF" opacity="0.55" transform="rotate(-5 298 291)"/>
  </g>

  <!-- Feuille principale : tableau de charges -->
  <g filter="url(#soft)">
    <rect x="150" y="52" width="372" height="452" rx="14" fill="url(#pg)"/>

    <!-- En-tête -->
    <rect x="182" y="88" width="150" height="11" rx="5.5" fill="#0B1C2C" opacity="0.82"/>
    <rect x="182" y="110" width="96" height="8" rx="4" fill="#4A6379" opacity="0.45"/>
    <line x1="182" y1="140" x2="490" y2="140" stroke="#0B1C2C" stroke-opacity="0.12" stroke-width="1.5"/>

    <!-- Lignes du tableau -->
    <g>
      <g>
        <rect x="182" y="162" width="118" height="8" rx="4" fill="#4A6379" opacity="0.55"/>
        <rect x="404" y="162" width="56" height="8" rx="4" fill="#0B1C2C" opacity="0.35"/>
      </g>
      <g>
        <rect x="182" y="200" width="146" height="8" rx="4" fill="#4A6379" opacity="0.55"/>
        <rect x="404" y="200" width="56" height="8" rx="4" fill="#0B1C2C" opacity="0.35"/>
      </g>
      <!-- ligne mise en évidence : poste à examiner -->
      <rect x="168" y="228" width="336" height="34" rx="8" fill="#17614F" opacity="0.09"/>
      <rect x="182" y="240" width="132" height="8" rx="4" fill="#17614F" opacity="0.85"/>
      <rect x="404" y="240" width="56" height="8" rx="4" fill="#17614F" opacity="0.85"/>
      <circle cx="492" cy="244" r="7" fill="#17614F"/>
      <path d="M489 244 l2.2 2.4 l4.4 -5" stroke="#fff" stroke-width="1.8" fill="none"
            stroke-linecap="round" stroke-linejoin="round"/>
      <g>
        <rect x="182" y="286" width="104" height="8" rx="4" fill="#4A6379" opacity="0.55"/>
        <rect x="404" y="286" width="56" height="8" rx="4" fill="#0B1C2C" opacity="0.35"/>
      </g>
      <g>
        <rect x="182" y="324" width="158" height="8" rx="4" fill="#4A6379" opacity="0.55"/>
        <rect x="404" y="324" width="56" height="8" rx="4" fill="#0B1C2C" opacity="0.35"/>
      </g>
      <g>
        <rect x="182" y="362" width="126" height="8" rx="4" fill="#4A6379" opacity="0.55"/>
        <rect x="404" y="362" width="56" height="8" rx="4" fill="#0B1C2C" opacity="0.35"/>
      </g>
    </g>

    <line x1="182" y1="404" x2="490" y2="404" stroke="#0B1C2C" stroke-opacity="0.12" stroke-width="1.5"/>
    <rect x="182" y="426" width="72" height="10" rx="5" fill="#0B1C2C" opacity="0.7"/>
    <rect x="398" y="426" width="62" height="10" rx="5" fill="#0B1C2C" opacity="0.7"/>
  </g>

  <!-- Carte flottante : répartition en barres -->
  <g filter="url(#soft)">
    <rect x="424" y="290" width="230" height="182" rx="14" fill="#FFFFFF"/>
    <rect x="452" y="318" width="86" height="8" rx="4" fill="#0B1C2C" opacity="0.62"/>

    <g>
      <rect x="452" y="404" width="26" height="42" rx="5" fill="url(#bar)" opacity="0.35"/>
      <rect x="492" y="382" width="26" height="64" rx="5" fill="url(#bar)" opacity="0.5"/>
      <rect x="532" y="352" width="26" height="94" rx="5" fill="url(#bar)"/>
      <rect x="572" y="392" width="26" height="54" rx="5" fill="url(#bar)" opacity="0.5"/>
      <rect x="612" y="418" width="26" height="28" rx="5" fill="url(#bar)" opacity="0.35"/>
    </g>
    <line x1="452" y1="452" x2="638" y2="452" stroke="#0B1C2C" stroke-opacity="0.14" stroke-width="1.5"/>
  </g>

  <!-- Loupe -->
  <g transform="translate(60 316)">
    <circle cx="56" cy="56" r="46" fill="#FFFFFF" fill-opacity="0.5" stroke="#0B1C2C" stroke-width="5" stroke-opacity="0.85"/>
    <line x1="90" y1="90" x2="122" y2="122" stroke="#0B1C2C" stroke-width="9" stroke-opacity="0.85" stroke-linecap="round"/>
    <path d="M34 62 L48 46 L60 56 L80 32" fill="none" stroke="#17614F" stroke-width="4.5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
